<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Davis Basement — Workshop &amp; Drawer Explorer (v24)</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0a0f1d" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #0a0f1d;
      --surface: #111827;
      --surface2: #161f32;
      --border: #1f2b42;
      --border-hi: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --sky: #38bdf8;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    button, input, select { font-family: inherit; }
    a { color: inherit; text-decoration: none; }
    .scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }

    /* App Shell */
    .app { display: flex; flex-direction: column; height: 100%; width: 100%; }
    .topbar {
      height: 54px; padding: 0 16px; background: rgba(17,24,39,0.96); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg,#2563eb,#10b981);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; flex-shrink: 0;
    }
    .brand-title { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.15; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    /* Segmented Top Nav (Desktop) */
    .nav-pills { display: flex; align-items: center; gap: 4px; background: #0a0f1d; padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .nav-btn {
      border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600;
      padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: all 0.16s ease; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-btn.active { background: #1e293b; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
    .nav-btn.active[data-view="map3d"], .nav-btn.active[data-view="drawers"] { background: #065f46; color: #ecfdf5; }
    .nav-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: rgba(255,255,255,0.12); }

    .main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    .view-pane { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
    .view-pane.active { display: flex; }

    /* Mobile Bottom Tab Bar */
    .bottom-nav {
      display: none; height: 60px; background: #0f172a; border-top: 1px solid var(--border);
      grid-template-columns: repeat(5, 1fr); flex-shrink: 0; z-index: 40; padding-bottom: env(safe-area-inset-bottom);
    }
    .bnav-btn {
      border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; cursor: pointer;
    }
    .bnav-btn .ico { font-size: 18px; line-height: 1; }
    .bnav-btn.active { color: var(--accent); }

    /* ===================================================================== */
    /* TAB 1: DRAWER DEEP-DIVE EXPLORER                                      */
    /* ===================================================================== */
    .dx-toolbar {
      padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .search-box {
      flex: 1; min-width: 0; position: relative; display: flex; align-items: center;
    }
    .search-box input {
      width: 100%; background: var(--bg); border: 1px solid var(--border-hi); color: #fff;
      border-radius: 10px; padding: 9px 12px 9px 34px; font-size: 13px; outline: none; transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box .s-ico { position: absolute; left: 11px; font-size: 14px; color: var(--muted); pointer-events: none; }
    .pill-btn {
      border: 1px solid var(--border-hi); background: var(--surface2); color: #e2e8f0;
      padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .pill-btn:hover { border-color: var(--sky); color: #fff; }
    .pill-btn.active { background: #0ea5e9; border-color: #38bdf8; color: #082f49; }

    /* Horizontal Toolbox Selector Strip */
    .tb-strip {
      display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #0d1424;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tb-card {
      flex: 0 0 auto; min-width: 190px; max-width: 230px; padding: 9px 12px; border-radius: 12px;
      background: var(--surface); border: 1.5px solid var(--border); cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .tb-card:hover { border-color: #475569; transform: translateY(-1px); }
    .tb-card.active { background: #162238; border-color: var(--accent); box-shadow: 0 4px 16px rgba(16,185,129,0.2); }
    .tb-card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .tb-dot { width: 10px; height: 10px; border-radius: 99px; flex-shrink: 0; }
    .tb-name { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-meta { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
    .match-chip { background: rgba(16,185,129,0.2); color: #6ee7b7; padding: 1px 6px; border-radius: 99px; font-weight: 700; }

    /* 2-Pane Explorer Body */
    .dx-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.05fr 0.95fr; overflow: hidden; }
    .dx-left { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .dx-right { overflow-y: auto; padding: 16px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }

    /* Realistic Steel Cabinet Elevation */
    .cab-wrap { width: 100%; max-width: 560px; }
    .cab-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; gap: 8px; }
    .cab-title { font-size: 15px; font-weight: 700; color: #fff; }
    .cab-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .cab-frame {
      border-radius: 16px; padding: 12px; border: 2px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 42px rgba(0,0,0,0.45);
    }
    .cab-inner { background: rgba(2,6,23,0.38); padding: 8px; border-radius: 11px; display: flex; flex-direction: column; gap: 6px; }
    .drw-row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .drw-btn {
      width: 100%; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); padding: 7px 11px;
      text-align: left; cursor: pointer; transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s;
      display: flex; flex-direction: column; justify-content: space-between; position: relative;
    }
    .drw-btn:hover { filter: brightness(1.09); }
    .drw-btn.selected { transform: translateX(8px) scale(1.015); border-color: #34d399; box-shadow: 0 8px 22px rgba(16,185,129,0.38); z-index: 2; }
    .drw-btn.dimmed { opacity: 0.24; }
    .drw-pull {
      height: 5px; width: 52%; margin: 0 auto 5px auto; border-radius: 3px;
      background: linear-gradient(180deg, #f8fafc, #94a3b8); box-shadow: 0 1px 2px rgba(0,0,0,0.45);
    }
    .drw-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .drw-lbl { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drw-sub { font-size: 10.5px; opacity: 0.82; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .tag-open { background: #10b981; color: #022c22; font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }
    .tag-empty { background: rgba(0,0,0,0.6); color: #fcd34d; font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }

    /* Photo Grid Mode */
    .dx-grid { width: 100%; max-width: 780px; display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; }
    .g-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden;
      cursor: pointer; transition: all 0.15s; text-align: left;
    }
    .g-card:hover { border-color: var(--sky); }
    .g-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16,185,129,0.35); }
    .g-thumb { width: 100%; height: 145px; object-fit: cover; background: #000; display: block; }
    .g-info { padding: 8px 10px; }
    .g-title { font-size: 11.5px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .g-desc { font-size: 10.5px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Inspector Right Pane */
    .ins-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .ins-kicker { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    .ins-title { font-size: 16px; font-weight: 700; color: #fff; margin-top: 2px; }
    .ins-nav { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border-hi); background: var(--surface2);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { border-color: var(--sky); }
    .photo-stage {
      position: relative; background: #020617; border-radius: 14px; border: 1px solid var(--border-hi);
      overflow: hidden; cursor: zoom-in; display: flex; align-items: center; justify-content: center; min-height: 220px;
    }
    .photo-stage img { width: 100%; max-height: 390px; object-fit: contain; display: block; }
    .zoom-hint {
      position: absolute; bottom: 10px; right: 10px; background: rgba(2,6,23,0.85); color: #f8fafc;
      font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.18);
    }
    .brand-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .brand-pill {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: rgba(56,189,248,0.14); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.32);
    }
    .manifest-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .manifest-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .manifest-list { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #e2e8f0; line-height: 1.4; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-primary {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: 0; background: #059669; color: #fff;
      font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: center; transition: background 0.15s;
    }
    .btn-primary:hover { background: #10b981; }
    .btn-secondary {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-hi); background: var(--surface2); color: #7dd3fc;
      font-size: 12.5px; font-weight: 600; cursor: pointer; text-align: center; transition: border-color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--sky); }

    /* ===================================================================== */
    /* TAB 2: SEARCH ALL 155 TOOLS                                           */
    /* ===================================================================== */
    .search-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; max-width: 1120px; width: 100%; margin: 0 auto; }
    .filter-bar { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
    .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .z-chip {
      flex: 0 0 auto; border: 1px solid var(--border-hi); background: var(--surface); color: #cbd5e1;
      padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .z-chip.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .tool-grid {
      flex: 1; overflow-y: auto; padding: 14px 16px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; align-content: start;
    }
    .t-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 6px; transition: border-color 0.15s;
    }
    .t-card:hover { border-color: #3b82f6; }
    .t-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .t-id { font-family: monospace; font-size: 11px; font-weight: 700; color: #38bdf8; background: rgba(56,189,248,0.12); padding: 2px 7px; border-radius: 6px; }
    .t-zone { font-size: 10.5px; font-weight: 700; color: var(--muted); }
    .t-name { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.38; }
    .t-loc { font-size: 11.5px; color: var(--muted); }
    .t-actions { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .mini-btn {
      padding: 6px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border-hi); background: var(--surface2); color: #e2e8f0;
    }
    .mini-btn:hover { border-color: var(--sky); color: #fff; }
    .mini-btn.green { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.45); color: #6ee7b7; }
    .mini-btn.green:hover { background: #059669; color: #fff; }

    /* ===================================================================== */
    /* TAB 3: CLEAN FULL-BLEED 3D WORKSHOP                                   */
    /* ===================================================================== */
    #canvas-wrap { position: relative; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #canvas-wrap:active { cursor: grabbing; }
    .hud-tl {
      position: absolute; top: 12px; left: 12px; z-index: 20; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .glass-select, .glass-btn {
      background: rgba(15,23,42,0.88); backdrop-filter: blur(10px); border: 1px solid rgba(148,163,184,0.3);
      color: #f8fafc; font-size: 12.5px; font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .view-popover {
      position: absolute; top: 54px; left: 12px; z-index: 25; width: 230px;
      background: rgba(15,23,42,0.96); backdrop-filter: blur(12px); border: 1px solid var(--border-hi);
      border-radius: 14px; padding: 10px; box-shadow: 0 16px 40px rgba(0,0,0,0.55); display: none; flex-direction: column; gap: 6px;
    }
    .view-popover.open { display: flex; }
    .pop-row {
      display: flex; justify-content: space-between; align-items: center; padding: 7px 9px; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid transparent; color: #e2e8f0; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .pop-row:hover { border-color: var(--border-hi); }
    .pop-row.on { background: rgba(16,185,129,0.16); border-color: rgba(16,185,129,0.45); color: #6ee7b7; }
    .fx-card {
      position: absolute; bottom: 16px; left: 16px; right: 16px; max-width: 440px; z-index: 22;
      background: rgba(15,23,42,0.95); backdrop-filter: blur(12px); border: 1px solid rgba(56,189,248,0.5);
      border-radius: 16px; padding: 14px 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: none;
    }
    .fx-card.open { display: block; }
    .hover-tip {
      position: fixed; z-index: 50; pointer-events: none; background: rgba(15,23,42,0.94);
      border: 1px solid rgba(56,189,248,0.5); border-radius: 9px; padding: 6px 10px; font-size: 11.5px; display: none;
    }

    /* ===================================================================== */
    /* TAB 4: SAFETY & PASS 2                                                */
    /* ===================================================================== */
    .info-shell { flex: 1; overflow-y: auto; padding: 16px; max-width: 1120px; width: 100%; margin: 0 auto; }
    .sec-h { font-size: 15px; font-weight: 700; color: #fff; margin: 4px 0 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .s-card { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 13px 15px; }
    .s-card.warn { border-color: rgba(245,158,11,0.55); }
    .s-card.cap { border-color: rgba(16,185,129,0.55); }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 84vh; object-fit: contain; border-radius: 12px; border: 1px solid #334155; }
    .lightbox-cap { margin-top: 12px; font-size: 12.5px; font-weight: 600; color: #e2e8f0; background: #111827; padding: 6px 14px; border-radius: 9px; border: 1px solid #334155; text-align: center; }

    /* Mobile Responsive Overrides */
    @media (max-width: 899px) {
      .nav-pills { display: none; }
      .brand-sub { display: none; }
      .topbar { height: 48px; padding: 0 12px; }
      .bottom-nav { display: grid; }
      .dx-body { grid-template-columns: 1fr; overflow-y: auto; display: flex; flex-direction: column; }
      .dx-left { overflow: visible; padding: 12px; }
      .dx-right { overflow: visible; border-left: 0; border-top: 1px solid var(--border); padding: 12px 12px 24px; }
      .tb-strip { padding: 8px 12px; }
      .tb-card { min-width: 165px; padding: 8px 10px; }
      .dx-toolbar { padding: 8px 12px; }
      .tool-grid { grid-template-columns: 1fr; padding: 10px 12px; }
    }

    /* Walls Deep-Zoom Wide-to-Close-Up Hotspot Marriage */
    .nav-btn.active[data-view="walls"] { background: #1d4ed8; color: #eff6ff; }
    .wide-map-wrap {
      position: relative; width: 100%; max-width: 560px; border-radius: 14px; overflow: hidden;
      border: 2px solid #334155; background: #020617; box-shadow: 0 14px 36px rgba(0,0,0,0.5);
    }
    .wide-map-wrap img { width: 100%; display: block; object-fit: contain; max-height: 410px; background: #020617; }
    .hs-box {
      position: absolute; border: 2px solid rgba(56,189,248,0.85); background: rgba(56,189,248,0.14);
      border-radius: 8px; cursor: pointer; transition: all 0.16s ease; display: flex; align-items: flex-end; padding: 3px 5px;
    }
    .hs-box:hover { background: rgba(56,189,248,0.32); border-color: #7dd3fc; transform: scale(1.015); z-index: 4; }
    .hs-box.active { border-color: #34d399; background: rgba(16,185,129,0.28); box-shadow: 0 0 0 2px rgba(16,185,129,0.45); z-index: 5; }
    .hs-lbl {
      font-size: 9.5px; font-weight: 800; color: #fff; background: rgba(2,6,23,0.82); padding: 1px 5px;
      border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .bay-list { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .bay-btn {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface);
      color: #e2e8f0; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; transition: all 0.15s;
    }
    .bay-btn:hover { border-color: var(--sky); }
    .bay-btn.active { background: #162238; border-color: #34d399; color: #fff; }
    /* Interactive High-Res Zoom & Pan Lightbox Controls */
    .lb-viewport {
      width: 94vw; height: 80vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
      position: relative; border-radius: 12px; border: 1px solid #334155; background: #020617; cursor: grab; touch-action: none;
    }
    .lb-viewport:active { cursor: grabbing; }
    .lb-viewport img {
      max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.12s ease-out;
      transform-origin: center center; user-select: none; -webkit-user-drag: none;
    }
    .lb-controls {
      margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .lb-btn {
      border: 1px solid #475569; background: #1e293b; color: #f8fafc; font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
    }
    .lb-btn:hover { border-color: #38bdf8; }
    .lb-btn.active { background: #059669; border-color: #34d399; }

  </style>
  <script>
    // Auto-clear any stale v22 offline Service Worker cache so v24+ updates always appear immediately
    if ('serviceWorker' in navigator) {

    const THEME = {

    function drwMatch(d, q) {
      if (!q) return true;
      return (d.label + ' ' + d.brands.join(' ') + ' ' + d.items.join(' ')).toLowerCase().includes(q);
    }

    function openToolboxInExplorer(fixId) {
      const tb = TOOLBOX_EXPLORER.find(t => t.fix === fixId);
      if (tb) { dxTbId = tb.id; dxDrwId = tb.drawers[0].id; }
      switchView('drawers');
      renderDrawers();
    }

    function renderDrawers() {
      const q = dxQuery.trim().toLowerCase();
      const strip = document.getElementById('tb-strip');
      strip.innerHTML = TOOLBOX_EXPLORER.map(tb => {
        const th = THEME[tb.theme] || THEME.blue;
        const hits = tb.drawers.filter(d => drwMatch(d, q)).length;
        return `
          <button class="tb-card ${tb.id === dxTbId ? 'active' : ''}" data-tb="${tb.id}">
            <div class="tb-card-top">
              <span class="tb-dot" style="background:${th.dot};"></span>
              <span class="tb-name">${tb.name}</span>
            </div>
            <div class="tb-meta">
              <span>${tb.zone} · ${tb.drawers.length} drawers</span>
              ${q ? `<span class="match-chip">${hits} hit${hits===1?'':'s'}</span>` : `<span style="color:#34d399;font-weight:600;">1080p</span>`}
            </div>
          </button>`;
      }).join('');
      strip.querySelectorAll('.tb-card').forEach(b => b.addEventListener('click', () => {
        dxTbId = b.getAttribute('data-tb');
        const tb = TOOLBOX_EXPLORER.find(t => t.id === dxTbId);
        const hit = tb.drawers.find(d => drwMatch(d, q)) || tb.drawers[0];
        dxDrwId = hit.id;
        renderDrawers();
      }));

      const tb = TOOLBOX_EXPLORER.find(t => t.id === dxTbId) || TOOLBOX_EXPLORER[0];
      let drw = tb.drawers.find(d => d.id === dxDrwId) || tb.drawers[0];
      if (q && !drwMatch(drw, q)) {
        const firstHit = tb.drawers.find(d => drwMatch(d, q));
        if (firstHit) { drw = firstHit; dxDrwId = firstHit.id; }
      }
      const th = THEME[tb.theme] || THEME.blue;
      const left = document.getElementById('dx-left');

      if (dxGridMode) {

    // Procedural Workshop Environment Map (PMREM) for metallic reflections on tool chests, chrome pulls & appliances
    (function buildWorkshopEnv() {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x1f2633);
      const eFloor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x3b424c }));

      });
      scene.environment = pmrem.fromScene(envScene, 0.04).texture;
      pmrem.dispose();
    })();

    // Realistic Workshop Lighting + Overhead LED Point Pools
    scene.add(new THREE.HemisphereLight(0xf8fafc, 0x3f3a34, 0.72));

    scene.add(fill);
    [[-6, 6.8, -8, 0.55], [-9, 6.8, 1, 0.50], [-1, 6.8, 0.5, 0.65], [9, 6.8, -3, 0.45], [0, 6.8, 9, 0.45]].forEach(([px, py, pz, inten]) => {

    // Procedural PBR Canvas Textures
    function makeTex(w, h, drawFn, repX = 1, repY = 1) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      drawFn(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c);
      t.encoding = THREE.sRGBEncoding;
      if (repX > 1 || repY > 1) {
        t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repX, repY);
      }
      t.anisotropy = 4;
      return t;
    }

    const TEX = {
      concrete: makeTex(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#5c6470'; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 6500; i++) {
          const x = Math.random() * w, y = Math.random() * h, r = Math.random() * 2.2;
          const v = 78 + Math.floor(Math.random() * 44);
          ctx.fillStyle = `rgba(${v},${v+3},${v+7},0.28)`;
          ctx.fillRect(x, y, r, r);
        }
        for (let i = 0; i < 18; i++) {
          const g = ctx.createRadialGradient(Math.random()*w, Math.random()*h, 6, Math.random()*w, Math.random()*h, 75);
          g.addColorStop(0, 'rgba(35,40,48,0.12)'); g.addColorStop(1, 'rgba(35,40,48,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        }
        ctx.strokeStyle = 'rgba(30,36,44,0.35)'; ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, w - 2, h - 2);
      }, 4, 4),
      cmu: makeTex(512, 256, (ctx, w, h) => {

        const rows = 4, cols = 4, bw = w / cols, bh = h / rows;
        for (let r = 0; r < rows; r++) {
          const off = (r % 2) * (bw / 2);
          for (let c = -1; c <= cols; c++) {
            const v = 102 + Math.floor(Math.random() * 14);
            ctx.fillStyle = `rgb(${v},${v+3},${v+6})`;
            ctx.fillRect(c * bw + off + 2, r * bh + 2, bw - 4, bh - 4);

      ply: makeTex(512, 512, (ctx, w, h) => {

          ctx.fillStyle = 'rgba(110,72,34,0.28)';

        }
        ctx.strokeStyle = 'rgba(92,58,28,0.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
      }, 2, 1),
      butcher: makeTex(512, 256, (ctx, w, h) => {
        const strips = 12, sh = h / strips;
        for (let s = 0; s < strips; s++) {
          const v = Math.floor(Math.random() * 28);
          ctx.fillStyle = `rgb(${182 + v},${134 + Math.floor(v*0.8)},${82 + Math.floor(v*0.6)})`;
          ctx.fillRect(0, s * sh, w, sh - 1);
          ctx.fillStyle = 'rgba(90,54,24,0.22)'; ctx.fillRect(0, (s+1)*sh - 1, w, 1);
        }
      }, 2, 2),
      woodDark: makeTex(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#754621'; ctx.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 2) {
          ctx.fillStyle = `rgba(48,25,10,${0.08 + Math.random()*0.12})`;

        }
      }, 1, 1),
      curtain: makeTex(256, 256, (ctx, w, h) => {
        ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3;
        for (let y = 0; y < h; y += 32) {
          for (let x = 0; x < w; x += 32) {

      rubberMat: makeTex(256, 256, (ctx, w, h) => {

      }, 3, 12),
      amgBanner: makeTex(512, 96, (ctx, w, h) => {

        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.strokeRect(4, 4, w - 8, h - 8);
        ctx.fillStyle = '#f8fafc'; ctx.font = 'italic bold 40px Inter, sans-serif';

      usFlag: makeTex(256, 160, (ctx, w, h) => {
        for (let i = 0; i < 13; i++) {
          ctx.fillStyle = i % 2 === 0 ? '#b91c1c' : '#f8fafc';
          ctx.fillRect(0, i * (h / 13), w, h / 13 + 1);
        }

        for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) ctx.fillRect(8 + c * 16, 8 + r * 15, 4, 4);

        ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, w, h);

    let activePointers = new Map(), prevPinchDist = 0;
    wrap.addEventListener('pointerdown', e => {
      if (e.target !== renderer.domElement) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        isDragging = true; isPanning = (e.button === 2 || e.shiftKey);
        prevX = downX = e.clientX; prevY = downY = e.clientY;
      } else if (activePointers.size === 2) {
        isDragging = false;
        const pts = Array.from(activePointers.values());
        prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }
    });
    window.addEventListener('pointerup', e => {
      if (isDragging && activePointers.size === 1 && Math.hypot(e.clientX - downX, e.clientY - downY) < 6 && e.target === renderer.domElement) {
        handleCanvasClick(e);
      }
      activePointers.delete(e.pointerId);
      if (activePointers.size === 0) { isDragging = false; isPanning = false; }
    });
    window.addEventListener('pointermove', e => {
      if (e.target === renderer.domElement && e.pointerType === 'mouse') handleHover(e);
      if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (prevPinchDist > 0) desiredSph.radius = Math.max(7, Math.min(62, desiredSph.radius - (d - prevPinchDist) * 0.08));
        prevPinchDist = d;
        return;
      }
      if (!isDragging) return;
      const dx = e.clientX - prevX, dy = e.clientY - prevY;
      prevX = e.clientX; prevY = e.clientY;
      if (isPanning) {
        const s = desiredSph.radius * 0.0018;
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
        const fwd = new THREE.Vector3().crossVectors(camera.up, right).normalize();
        desiredTarget.addScaledVector(right, -dx * s);

    // High-Res Interactive Pan & Zoom Lightbox (1x / 2x / 3.5x + Wide<->Close-Up Swap!)
    let lbScale = 1, lbTx = 0, lbTy = 0, lbDrag = false, lbSx = 0, lbSy = 0;
    let lbSwapPair = null, lbShowingAlt = false;
    const lbEl = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCap = document.getElementById('lb-cap');
    const lbVp = document.getElementById('lb-viewport');
    const lbSwapBtn = document.getElementById('lb-swap-btn');

    function applyLbTransform() {
      lbImg.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
      document.querySelectorAll('[data-zoom]').forEach(b => b.classList.toggle('active', Number(b.getAttribute('data-zoom')) === lbScale));
    }
    function openSmartLightbox(src, cap, altSrc, altCap) {
      lbScale = 1; lbTx = 0; lbTy = 0; lbShowingAlt = false;
      lbImg.src = src;
      lbCap.textContent = cap;
      if (altSrc && altSrc !== src) {
        lbSwapPair = { main: src, mainCap: cap, alt: altSrc, altCap: altCap || cap };
        lbSwapBtn.style.display = 'inline-block';
        lbSwapBtn.textContent = '↔ Show Wide Wall View';
      } else {
        lbSwapPair = null;
        lbSwapBtn.style.display = 'none';
      }
      applyLbTransform();
      lbEl.classList.add('open');
    }
    document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      lbScale = Number(b.getAttribute('data-zoom'));
      if (lbScale === 1) { lbTx = 0; lbTy = 0; }
      applyLbTransform();
    }));
    lbSwapBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!lbSwapPair) return;
      lbShowingAlt = !lbShowingAlt;
      lbScale = 1; lbTx = 0; lbTy = 0;
      lbImg.src = lbShowingAlt ? lbSwapPair.alt : lbSwapPair.main;
      lbCap.textContent = lbShowingAlt ? lbSwapPair.altCap : lbSwapPair.mainCap;
      lbSwapBtn.textContent = lbShowingAlt ? '↔ Back to High-Res Close-Up' : '↔ Show Wide Wall View';
      applyLbTransform();
    });
    document.getElementById('lb-close-btn').addEventListener('click', () => lbEl.classList.remove('open'));
    lbVp.addEventListener('pointerdown', (e) => {
      if (lbScale <= 1) return;
      lbDrag = true; lbSx = e.clientX - lbTx; lbSy = e.clientY - lbTy;
      lbVp.setPointerCapture(e.pointerId);
    });
    lbVp.addEventListener('pointermove', (e) => {
      if (!lbDrag) return;
      lbTx = e.clientX - lbSx; lbTy = e.clientY - lbSy;
      applyLbTransform();
    });
    lbVp.addEventListener('pointerup', () => { lbDrag = false; });
    lbVp.addEventListener('wheel', (e) => {
      e.preventDefault();
      const next = Math.max(1, Math.min(4, +(lbScale + (e.deltaY < 0 ? 0.5 : -0.5)).toFixed(1)));
      lbScale = next;
      if (lbScale === 1) { lbTx = 0; lbTy = 0; }
      applyLbTransform();
    }, { passive: false });

    // Helper: Look up exact close-up bay image by ID
    function getBayImg(bayId) {
      for (const w of WALL_EXPLORER) {
        const b = w.bays.find(x => x.id === bayId);
        if (b) return b.img;
      }
      return null;
    }
    function getExactFixturePhoto(fixId, zone) {
      const m = FIXTURE_EXACT_PHOTO[fixId];
      if (m) {
        const img = m.src === 'bay' ? getBayImg(m.key) : WIDE_WALL_PHOTOS[m.key];
        if (img) return { img, cap: m.cap, wallId: m.wallId, bayId: m.bayId };
      }
      return { img: WIDE_WALL_PHOTOS[zone] || WIDE_WALL_PHOTOS.Z1, cap: zone + ' Wall Context', wallId: null, bayId: null };
    }

    // Dedicated Walls Explorer Renderer (Marries Wide Wall Overview Hotspots -> Crisp 1080p Close-Ups!)
    let wlId = WALL_EXPLORER[0].id;
    let wlBayId = WALL_EXPLORER[0].bays[0].id;
    let wlGridMode = false;
    let wlQuery = '';

    function bayMatches(b, q) {
      if (!q) return true;
      return (b.label + ' ' + (b.brands || []).join(' ') + ' ' + (b.items || []).join(' ')).toLowerCase().includes(q);
    }

    function openWallInExplorer(wallId, bayId) {
      const w = WALL_EXPLORER.find(x => x.id === wallId) || WALL_EXPLORER[0];
      wlId = w.id;
      wlBayId = (bayId && w.bays.some(b => b.id === bayId)) ? bayId : w.bays[0].id;
      switchView('walls');
      renderWalls();
    }

    function renderWalls() {
      const q = wlQuery.trim().toLowerCase();
      const strip = document.getElementById('wl-strip');
      strip.innerHTML = WALL_EXPLORER.map(w => {
        const hits = w.bays.filter(b => bayMatches(b, q)).length;
        return `
          <button class="tb-card ${w.id === wlId ? 'active' : ''}" data-wl="${w.id}">
            <div class="tb-card-top">
              <span class="tb-dot" style="background:#38bdf8;"></span>
              <span class="tb-name">${w.name}</span>
            </div>
            <div class="tb-meta">
              <span>${w.zone} · ${w.bays.length} bays</span>
              ${q ? `<span class="match-chip">${hits} hit${hits===1?'':'s'}</span>` : `<span style="color:#7dd3fc;font-weight:600;">Wide + HD</span>`}
            </div>
          </button>`;
      }).join('');
      strip.querySelectorAll('[data-wl]').forEach(btn => btn.addEventListener('click', () => {
        wlId = btn.getAttribute('data-wl');
        const w = WALL_EXPLORER.find(x => x.id === wlId);
        const firstHit = w.bays.find(b => bayMatches(b, q)) || w.bays[0];
        wlBayId = firstHit.id;
        renderWalls();
      }));

      const w = WALL_EXPLORER.find(x => x.id === wlId) || WALL_EXPLORER[0];
      let bay = w.bays.find(b => b.id === wlBayId) || w.bays[0];
      if (q && !bayMatches(bay, q)) {
        const fh = w.bays.find(b => bayMatches(b, q));
        if (fh) { bay = fh; wlBayId = fh.id; }
      }
      const wideImg = WIDE_WALL_PHOTOS[w.wideKey] || WIDE_WALL_PHOTOS[w.zone] || bay.img;
      const left = document.getElementById('wl-left');

      if (wlGridMode) {
        const list = w.bays.filter(b => bayMatches(b, q));
        left.innerHTML = `
          <div style="width:100%;max-width:780px;margin-bottom:10px;">
            <div class="cab-title">${w.name} — All Close-Up Bays (${list.length})</div>
            <div class="cab-sub">Tap any bay to inspect high-res detail &amp; zoom up to 3.5×</div>
          </div>
          <div class="dx-grid">
            ${list.map(b => `
              <button class="g-card ${b.id === bay.id ? 'selected' : ''}" data-bay="${b.id}">
                <img class="g-thumb" loading="lazy" src="${b.img}" alt="${b.label}" />
                <div class="g-info">
                  <div class="g-title">${b.label}</div>
                  <div class="g-desc">${(b.items || []).slice(0,2).join(' · ')}</div>
                </div>
              </button>`).join('') || '<div style="color:#94a3b8;font-size:13px;">No matching wall bays.</div>'}
          </div>`;
      } else {
        // Interactive Wide Wall Overview Photo with Clickable Close-Up Hotspots!
        const hotspotsHtml = w.bays.filter(b => b.hs).map(b => {
          const hs = b.hs;
          const act = b.id === bay.id;
          const dim = q && !bayMatches(b, q) ? 'opacity:0.25;' : '';
          return `<button class="hs-box ${act ? 'active' : ''}" data-bay="${b.id}" style="left:${hs.x}%;top:${hs.y}%;width:${hs.w}%;height:${hs.h}%;${dim}" title="Zoom into ${b.label}">
            <span class="hs-lbl">${act ? '🔍 ' : ''}${hs.short}</span>
          </button>`;
        }).join('');

        left.innerHTML = `
          <div style="width:100%;max-width:560px;margin-bottom:8px;">
            <div class="cab-title">${w.name}</div>
            <div class="cab-sub">Tap any glowing box on the wide wall photo to zoom into its crisp 1080p close-up →</div>
          </div>
          <div class="wide-map-wrap">
            <img src="${wideImg}" alt="${w.name} Wide View" />
            ${hotspotsHtml}
          </div>
          <div class="bay-list">
            ${w.bays.map((b, i) => `
              <button class="bay-btn ${b.id === bay.id ? 'active' : ''}" data-bay="${b.id}" style="${(q && !bayMatches(b,q)) ? 'opacity:0.35;' : ''}">
                <span style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i+1}. ${b.label}</span>
                <span style="font-size:10px;color:#34d399;font-weight:700;flex-shrink:0;">${b.id === bay.id ? 'HD OPEN' : 'HD Zoom →'}</span>
              </button>`).join('')}
          </div>`;
      }

      left.querySelectorAll('[data-bay]').forEach(el => el.addEventListener('click', () => {
        wlBayId = el.getAttribute('data-bay');
        renderWalls();
        if (window.innerWidth < 900) document.getElementById('wl-right').scrollIntoView({ behavior:'smooth', block:'start' });
      }));

      // Right High-Res Close-Up Detail Inspector
      const idx = w.bays.findIndex(b => b.id === bay.id);
      const right = document.getElementById('wl-right');
      right.innerHTML = `
        <div class="ins-head">
          <div>
            <div class="ins-kicker">${w.zone} · HD Close-Up ${idx + 1} of ${w.bays.length} · ${bay.clip || '1080p'}</div>
            <div class="ins-title">${bay.label}</div>
          </div>
          <div class="ins-nav">
            <button id="wl-prev" class="icon-btn" title="Previous Bay">←</button>
            <button id="wl-next" class="icon-btn" title="Next Bay">→</button>
          </div>
        </div>

        <div id="wl-photo-stage" class="photo-stage">
          <img src="${bay.img}" alt="${bay.label}" />
          <span class="zoom-hint">🔍 Tap for 3.5× Macro Zoom &amp; Wide Compare</span>
        </div>

        ${(bay.brands && bay.brands.length) ? `<div class="brand-row">${bay.brands.map(br => `<span class="brand-pill">${br}</span>`).join('')}</div>` : ''}

        <div class="manifest-box">
          <div class="manifest-title">Verified Tools &amp; Gear on This Wall Section</div>
          <ul class="manifest-list">${(bay.items || []).map(it => `<li>${it}</li>`).join('')}</ul>
        </div>

        <div class="action-row">
          <button id="wl-show-3d" class="btn-primary">📍 Show Wall in 3D</button>
          <button id="wl-compare-wide" class="btn-secondary">↔ Wide vs Close-Up Zoom</button>
        </div>`;

      document.getElementById('wl-prev').onclick = () => {
        wlBayId = w.bays[(idx - 1 + w.bays.length) % w.bays.length].id;
        renderWalls();
      };
      document.getElementById('wl-next').onclick = () => {
        wlBayId = w.bays[(idx + 1) % w.bays.length].id;
        renderWalls();
      };
      const launchCompare = () => openSmartLightbox(bay.img, w.name + ' — ' + bay.label + ' (HD Close-Up)', wideImg, w.name + ' — Wide Wall Context');
      document.getElementById('wl-photo-stage').onclick = launchCompare;
      document.getElementById('wl-compare-wide').onclick = launchCompare;
      document.getElementById('wl-show-3d').onclick = () => {
        switchView('map3d');
        const matchFix = Object.keys(FIXTURE_EXACT_PHOTO).find(k => FIXTURE_EXACT_PHOTO[k].bayId === bay.id) || FIXTURES.find(f => f.zone === w.zone)?.id;
        if (matchFix) selectFixture(matchFix, true);
      };
    }

    document.getElementById('wl-mode-btn').addEventListener('click', (e) => {
      wlGridMode = !wlGridMode;
      e.target.textContent = wlGridMode ? '🗺️ Wide Map' : '📷 Grid';
      e.target.classList.toggle('active', wlGridMode);
      renderWalls();
    });
    document.getElementById('wl-search').addEventListener('input', (e) => {
      wlQuery = e.target.value;
      const q = wlQuery.trim().toLowerCase();
      if (q) {
        const cur = WALL_EXPLORER.find(w => w.id === wlId);
        if (!cur || !cur.bays.some(b => bayMatches(b, q))) {
          const hitW = WALL_EXPLORER.find(w => w.bays.some(b => bayMatches(b, q)));
          if (hitW) { wlId = hitW.id; wlBayId = hitW.bays.find(b => bayMatches(b, q)).id; }
        }
      }
      renderWalls();
    });

    // Override selectFixture to use EXACT 1-to-1 photo alignment + 1-click "🧱 Inspect Wall & Hotspots" + 3.5x Macro Zoom!
    const _v23SelectFixture = selectFixture;
    selectFixture = function(fixId, shouldFly = true) {
      _v23SelectFixture(fixId, shouldFly);
      if (!fixId) return;
      const f = FIXTURES.find(x => x.id === fixId);
      if (!f) return;
      const exact = getExactFixturePhoto(fixId, f.zone);
      // Replace the fixture card's photo with the EXACT matching fixture/wall photo!
      const card = document.getElementById('fixture-card');
      const imgEl = card.querySelector('img');
      if (imgEl && exact.img) {
        imgEl.src = exact.img;
        imgEl.alt = exact.cap;
        const wideForZone = WIDE_WALL_PHOTOS[f.zone] || exact.img;
        imgEl.onclick = () => openSmartLightbox(exact.img, exact.cap, wideForZone, f.zone + ' Wide Overview');
      }
      // Inject "🧱 Inspect Wall & HD Zoom" button if this fixture belongs to a wall in WALL_EXPLORER
      const acts = document.getElementById('fc-actions');
      if (acts && exact.wallId && !acts.querySelector('[data-jump-wall]')) {
        const wBtn = document.createElement('button');
        wBtn.className = 'btn-primary';
        wBtn.style.background = '#1d4ed8';
        wBtn.setAttribute('data-jump-wall', exact.wallId);
        wBtn.textContent = '🧱 Inspect Wall & HD Zoom';
        wBtn.onclick = () => openWallInExplorer(exact.wallId, exact.bayId);
        acts.prepend(wBtn);
      }
    };

    // Also upgrade Drawer Explorer photo click to use the 3.5x Interactive Zoom Lightbox!
    const _origRenderDrawers = renderDrawers;
    renderDrawers = function() {
      _origRenderDrawers();
      const ps = document.getElementById('photo-stage');
      if (ps) {
        const img = ps.querySelector('img');
        const tb = TOOLBOX_EXPLORER.find(t => t.id === dxTbId) || TOOLBOX_EXPLORER[0];
        const drw = tb.drawers.find(d => d.id === dxDrwId) || tb.drawers[0];
        if (img) ps.onclick = () => openSmartLightbox(drw.img, tb.name + ' — ' + drw.label + ' (' + drw.clip + ')', null, null);
      }
    };

    renderWalls();
    renderDrawers();

  </script>
</body>
</html>
